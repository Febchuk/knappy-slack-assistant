[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knappy-slack-assistant"
version = "0.1.0"
description = "Ambient relationship and executive assistant for Slack."
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.22",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "pydantic>=2",
    "aiohttp>=3.9",
    "asyncpg>=0.29",
    "google-genai>=1.0",
    "fastembed>=0.4",
    "httpx>=0.27",
    "trafilatura>=2",
    "pypdf>=5",
    "python-docx>=1.1",
    "mcp>=2.3",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
]

[tool.setuptools.packages.find]
include = ["knappy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -m 'not live_model'"
markers = ["live_model: calls the real Gemini API; needs GEMINI_API_KEY"]

[tool.coverage.run]
source = ["knappy"]
